[package]
name = "petri"
version = "0.1.0"
edition = "2024"
authors = ["PyMite6941"]
description = "A defensive Linux sandbox manager. Work in progress."
readme = "README.md"
repository = "https://github.com/PyMite6941/petri"
license-file = "LICENSE"

# Redistribution is prohibited by LICENSE section 3, and that includes package
# registries. This stops `cargo publish` from ever going through by accident.
publish = false

[dependencies]
eframe = "0.32"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[lib]
